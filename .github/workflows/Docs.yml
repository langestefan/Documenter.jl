name: Docs

on:
  push:
    branches:
      - main
      - stay-on-page-with-workflow
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
    tags: ["*"]
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Use Julia cache
        uses: julia-actions/cache@v2
      - name: Instantiate environment with development version of the package and required doc tools
        run: |
          julia --project=docs -e '
            using Pkg
            # develop the current package so docs pick up local source
            Pkg.develop(PackageSpec(path=pwd()))
            # also develop DocumenterTools so it is available as a git checkout
            # (prevents MissingRemoteError when generating source URLs)
            try
                Pkg.develop(PackageSpec(url="https://github.com/JuliaDocs/DocumenterTools.jl"))
            catch e
                @warn "could not develop DocumenterTools: $e"
            end
            Pkg.instantiate()'
      - name: Generate and deploy documentation
        run: julia --project=docs docs/make.jl
        env:
          JULIA_PKG_SERVER: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GKSwstype: "100" # https://discourse.julialang.org/t/generation-of-documentation-fails-qt-qpa-xcb-could-not-connect-to-display/60988
